<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GuppyLM</title>
<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&display=swap');
  :root {
    /* ── 入力欄 ── */
    --input-width: 40vw;
    --input-top: 5vh;

    /* ── 回答欄 (中心から上方向へのオフセット) ── */
    --response-y: -30vh;
    --response-font-size: 2.5vw;

    /* ── グッピー ── */
    --guppy-width: 25vw;
    --guppy-y: 0vh;          /* 画面中心からの垂直オフセット */

    /* ── グッピー泳ぐ範囲 (CSS参照用, 実値はJSで使用) ── */
    --swim-range: 40vw;

    /* ── 海藻1 (左奥) ── */
    --sw1-x: -25vw;
    --sw1-bottom: 10vh;
    --sw1-width: 16vw;
    --sw1-opacity: 1;

    /* ── 海藻2 (中左) ── */
    --sw2-x: -11vw;
    --sw2-bottom: 24vh;
    --sw2-width: 11vw;
    --sw2-opacity: 0.33;

    /* ── 海藻3 (中右) ── */
    --sw3-x: 11vw;
    --sw3-bottom: 24vh;
    --sw3-width: 11vw;
    --sw3-opacity: 0.33;

    /* ── 海藻4 (右奥) ── */
    --sw4-x: 25vw;
    --sw4-bottom: 10vh;
    --sw4-width: 16vw;
    --sw4-opacity: 1;
  }

  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .chat-ui {
    width: var(--input-width);
    margin-top: var(--input-top);
    font-family: monospace;
    position: relative;
    z-index: 1;
  }
  #response {
    position: absolute;
    left: 50%;
    top: calc(50% + var(--response-y));
    transform: translateX(-50%);
    white-space: nowrap;
    font-family: "Hachi Maru Pop", cursive;
    font-weight: 400;
    font-size: var(--response-font-size);
    text-align: center;
  }
  #input-row { display: flex; }
  #user-input {
    flex: 1;
    font-family: monospace;
    font-size: 14px;
    padding: 8px 20px;
    border: 2px solid #aaa;
    border-radius: 9999px;
    outline: none;
  }
  #user-input:focus { border-color: #5b9bd5; }
  .guppy {
    position: absolute;
    width: var(--guppy-width);
    aspect-ratio: 1 / 1;
    top: calc(50% + var(--guppy-y) - var(--guppy-width) / 2);
    z-index: 2;
  }
  .seaweed {
    position: absolute;
    transform: translateX(-50%);
  }
  .seaweed:nth-of-type(1) { left: calc(50% + var(--sw1-x)); bottom: var(--sw1-bottom); width: var(--sw1-width); opacity: var(--sw1-opacity); z-index: 3; }
  .seaweed:nth-of-type(2) { left: calc(50% + var(--sw2-x)); bottom: var(--sw2-bottom); width: var(--sw2-width); opacity: var(--sw2-opacity); z-index: 1; }
  .seaweed:nth-of-type(3) { left: calc(50% + var(--sw3-x)); bottom: var(--sw3-bottom); width: var(--sw3-width); opacity: var(--sw3-opacity); z-index: 1; }
  .seaweed:nth-of-type(4) { left: calc(50% + var(--sw4-x)); bottom: var(--sw4-bottom); width: var(--sw4-width); opacity: var(--sw4-opacity); z-index: 3; }
</style>
</head>
<body>

<!-- 海藻: 位置・サイズは :root のCSS変数で制御 -->
<img class="seaweed" src="seaweed1.svg">
<img class="seaweed" src="seaweed2.svg">
<img class="seaweed" src="seaweed1.svg">
<img class="seaweed" src="seaweed2.svg">

<img class="guppy" id="guppy" src="guppy.svg">

<div id="response"></div>

<div class="chat-ui">
  <div id="input-row">
    <input type="text" id="user-input" list="prompt-list" placeholder="type a message..." autocomplete="off" />
    <datalist id="prompt-list">
      <option value="コンニチハ グッピー">
      <option value="チョウシ ハ ドウ?">
      <option value="エサ アゲル ネ">
      <option value="キョウ ハ アツイ ネ">
      <option value="サムイ ケド ダイジョウブ?">
      <option value="セイジ ッテ シッテル?">
      <option value="ミズ カエタヨ">
      <option value="デンキ ツケタヨ">
      <option value="ゴメン オトシチャッタ">
      <option value="オヤスミ グッピー">
      <option value="キミ ハ ナニ?">
      <option value="サミシイ?">
      <option value="アタラシイ イシ ダヨ">
      <option value="スウガク デキル?">
      <option value="ナニ カンガエテル?">
      <option value="エサ ノ ジカン ダヨ">
    </datalist>
  </div>
</div>

<script>
const el = document.getElementById('guppy');

// ── 泳ぐ範囲 (vw) ── CSS変数から取得
const SWIM_RANGE_VW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--swim-range'));
const GUPPY_WIDTH_VW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--guppy-width'));

function vw2px(vw) { return window.innerWidth * vw / 100; }

const range = vw2px(SWIM_RANGE_VW);
const guppyW = vw2px(GUPPY_WIDTH_VW);
const center = (window.innerWidth - guppyW) / 2;
const left = center - range / 2;
const right = center + range / 2;

function swimRight() {
  anime.timeline({ complete: swimLeft })
    .add({ targets: el, left: right, duration: 6000, easing: 'linear' })
    .add({ targets: el, rotateY: [180, 360], duration: 1000, easing: 'easeInOutQuad' });
}

function swimLeft() {
  anime.timeline({ complete: swimRight })
    .add({ targets: el, left: left, duration: 6000, easing: 'linear' })
    .add({ targets: el, rotateY: [360, 540], duration: 1000, easing: 'easeInOutQuad' });
}

el.style.left = left + 'px';
el.style.transform = 'rotateY(180deg)';
swimRight();
</script>

<script type="module">
const CONFIG = {
  vocab_size: 4096, max_seq_len: 128,
  pad_id: 0, bos_id: 1, eos_id: 2,
};
const GEN = { temperature: 0.7, top_k: 50, max_tokens: 32 };

let session, tokenizer;

// ── ByteLevel BPE tokenizer ──
function buildTokenizer(json) {
  const vocab = json.model.vocab;
  const merges = json.model.merges;
  const added = {};
  for (const t of json.added_tokens) added[t.content] = t.id;
  const id2token = {};
  for (const [tok, id] of Object.entries(vocab)) id2token[id] = tok;
  for (const [tok, id] of Object.entries(added)) id2token[id] = tok;

  const byte2char = {};
  const char2byte = {};
  const ranges = [[33,126],[161,172],[174,255]];
  const direct = new Set();
  for (const [lo,hi] of ranges) for (let b = lo; b <= hi; b++) direct.add(b);
  let n = 0;
  for (let b = 0; b < 256; b++) {
    byte2char[b] = direct.has(b) ? String.fromCharCode(b) : String.fromCharCode(256 + n++);
  }
  for (const [b,c] of Object.entries(byte2char)) char2byte[c] = parseInt(b);

  const mergeRank = {};
  for (let i = 0; i < merges.length; i++) {
    const key = Array.isArray(merges[i]) ? merges[i].join(" ") : merges[i];
    mergeRank[key] = i;
  }

  function bpe(word) {
    if (word.length <= 1) return word;
    let pieces = word.slice();
    while (pieces.length > 1) {
      let bestRank = Infinity, bestIdx = -1;
      for (let i = 0; i < pieces.length - 1; i++) {
        const rank = mergeRank[pieces[i] + " " + pieces[i+1]];
        if (rank !== undefined && rank < bestRank) { bestRank = rank; bestIdx = i; }
      }
      if (bestIdx === -1) break;
      pieces = [...pieces.slice(0, bestIdx), pieces[bestIdx]+pieces[bestIdx+1], ...pieces.slice(bestIdx+2)];
    }
    return pieces;
  }

  const PAT = /'(?:[sdmt]|ll|ve|re)| ?\p{L}+| ?\p{N}+| ?[^\s\p{L}\p{N}]+|\s+(?!\S)|\s+/gu;

  function encode(text) {
    const specialRe = new RegExp("(" + Object.keys(added).map(s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")");
    const ids = [];
    for (const seg of text.split(specialRe)) {
      if (!seg) continue;
      if (added[seg] !== undefined) { ids.push(added[seg]); continue; }
      for (const word of seg.match(PAT) || [seg]) {
        const byteChars = [...Array.from(new TextEncoder().encode(word)).map(b => byte2char[b]).join("")];
        for (const tok of bpe(byteChars)) {
          const id = vocab[tok];
          if (id !== undefined) ids.push(id);
        }
      }
    }
    return ids;
  }

  function decode(ids) {
    const parts = [];
    for (const id of ids) {
      const tok = id2token[id];
      if (tok && added[tok] === undefined) parts.push(tok);
    }
    const bytes = Uint8Array.from([...parts.join("")].map(c => char2byte[c] ?? c.charCodeAt(0)));
    return new TextDecoder("utf-8", { fatal: false }).decode(bytes);
  }

  return { encode, decode };
}

// ── Load ──
const ort = await import("https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.min.mjs");
ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/";

const tokJson = await (await fetch("tokenizer.json")).json();
tokenizer = buildTokenizer(tokJson);

const modelBuf = await (await fetch("model.onnx")).arrayBuffer();
session = await ort.InferenceSession.create(modelBuf, { executionProviders: ["wasm"] });

document.getElementById("user-input").focus();

// ── Generate ──
async function generate(inputIds) {
  let ids = inputIds.slice();
  for (let i = 0; i < GEN.max_tokens; i++) {
    const seq = ids.slice(-CONFIG.max_seq_len);
    const tensor = new ort.Tensor("int64", BigInt64Array.from(seq.map(BigInt)), [1, seq.length]);
    const logits = (await session.run({ input_ids: tensor })).logits.data;
    const off = (seq.length - 1) * CONFIG.vocab_size;
    const last = new Float32Array(CONFIG.vocab_size);
    for (let v = 0; v < CONFIG.vocab_size; v++) last[v] = logits[off + v] / GEN.temperature;
    if (GEN.top_k > 0) {
      const cutoff = [...last].sort((a,b) => b-a)[Math.min(GEN.top_k, last.length) - 1];
      for (let v = 0; v < CONFIG.vocab_size; v++) if (last[v] < cutoff) last[v] = -Infinity;
    }
    const mx = Math.max(...last.filter(v => v !== -Infinity));
    let sum = 0;
    const probs = new Float32Array(CONFIG.vocab_size);
    for (let v = 0; v < CONFIG.vocab_size; v++) { probs[v] = Math.exp(last[v] - mx); sum += probs[v]; }
    let r = Math.random(), acc = 0, nextId = 0;
    for (let v = 0; v < CONFIG.vocab_size; v++) { acc += probs[v]/sum; if (acc >= r) { nextId = v; break; } }
    ids.push(nextId);
    if (nextId === CONFIG.eos_id) break;
  }
  return ids.slice(inputIds.length);
}

// ── Validate & Convert ──
function sanitize(raw) {
  let s = raw;
  // 全角スペース → 半角スペース
  s = s.replace(/\u3000/g, ' ');
  // ひらがな → 全角カタカナ (ぁ-ゖ → ァ-ヶ)
  s = s.replace(/[\u3041-\u3096]/g, ch =>
    String.fromCharCode(ch.charCodeAt(0) + 0x60)
  );
  // トリム + 連続スペース圧縮
  s = s.trim().replace(/ {2,}/g, ' ');
  if (!s) return '';
  // 許可: 全角カタカナ(ァ-ヶ), 長音(ー), ？, ?, 半角スペース
  if (/[^\u30A1-\u30F6\u30FC\uFF1F? ]/.test(s)) return null;
  return s;
}

// ── Send ──
async function send() {
  const input = document.getElementById("user-input");
  const raw = input.value;
  const text = sanitize(raw);
  if (text === '') return;
  if (text === null) {
    input.value = "";
    document.getElementById("response").textContent = "カタカナ シカ ワカラナイ。";
    input.focus();
    return;
  }
  input.value = "";
  document.getElementById("response").textContent = "...";

  const prompt = `<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`;
  const outputIds = await generate(tokenizer.encode(prompt));
  let reply = tokenizer.decode(outputIds).trim();
  if (reply.includes("<|im_end|>")) reply = reply.split("<|im_end|>")[0];
  if (reply.includes("<|im_start|>")) reply = reply.split("<|im_start|>")[0];
  document.getElementById("response").textContent = reply.trim() || "blub.";

  input.focus();
}

document.getElementById("user-input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
