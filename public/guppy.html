<!DOCTYPE html>
<html lang="ja">
<meta charset="UTF-8">
<title>Guppy</title>
<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .guppy {
    position: absolute;
    width: 360px;
    height: 360px;
  }
  .seaweed {
    position: absolute;
    transform: translateX(-50%);
  }
</style>
<body>

<!-- 海藻: left=calc(50% + 中心からの距離px), bottom=下からの距離px, width=表示幅, opacity=不透明度 -->
<img class="seaweed" src="seaweed1.svg" style="left:calc(50% - 380px); bottom:100px; width:240px;">
<img class="seaweed" src="seaweed2.svg" style="left:calc(50% - 160px); bottom:240px; width:160px; opacity:0.33;">
<img class="seaweed" src="seaweed1.svg" style="left:calc(50% + 160px); bottom:240px; width:160px; opacity:0.33;">
<img class="seaweed" src="seaweed2.svg" style="left:calc(50% + 380px); bottom:100px; width:240px;">

<img class="guppy" id="guppy" src="guppy.svg">

<script>  
const el = document.getElementById('guppy');
const RANGE = 640;
const center = (window.innerWidth - 240) / 2;
const left = center - RANGE / 2;
const right = center + RANGE / 2;

function swimRight() {
  anime.timeline({ complete: swimLeft })
    .add({ targets: el, left: right, duration: 6000, easing: 'linear' })
    .add({ targets: el, rotateY: [180, 360], duration: 500, easing: 'easeInOutQuad' });
}

function swimLeft() {
  anime.timeline({ complete: swimRight })
    .add({ targets: el, left: left, duration: 6000, easing: 'linear' })
    .add({ targets: el, rotateY: [360, 540], duration: 500, easing: 'easeInOutQuad' });
}

el.style.left = left + 'px';
el.style.transform = 'rotateY(180deg)';
swimRight();
</script>
</body>
</html>
